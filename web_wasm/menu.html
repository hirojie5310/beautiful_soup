<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Wasm Runner Menu</title>
    <style>
      :root {
        --bg: #050817;
        --panel: rgba(16, 24, 56, 0.96);
        --text: #eef2ff;
        --muted: #acb6d7;
        --accent: #ffe588;
        --ok: #89f0ac;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #1c2b7a 0%, transparent 45%), var(--bg);
        color: var(--text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      }
      .layout {
        width: min(440px, 100vw);
        min-height: 100vh;
        margin: 0 auto;
        padding: 10px;
        display: grid;
        gap: 10px;
        grid-template-rows: auto auto auto;
        align-content: start;
      }
      .frame {
        border: 2px solid rgba(255,255,255,0.45);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px;
      }
      .title {
        margin: 0 0 8px;
        font-size: 1rem;
        color: var(--accent);
      }
      .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .btn {
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 8px;
        color: var(--text);
        background: linear-gradient(180deg, #4459bf, #20317e);
        padding: 8px 10px;
        cursor: pointer;
      }
      .party-list {
        display: grid;
        gap: 8px;
      }
      .member-card {
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 8px;
        background: rgba(0,0,0,0.26);
        padding: 8px;
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 8px;
      }
      .portrait {
        width: 72px;
        height: 72px;
        object-fit: cover;
        object-position: center 20%;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.08);
      }
      .portrait-fallback {
        width: 72px;
        height: 72px;
        border-radius: 6px;
        border: 1px dashed rgba(255,255,255,0.55);
        display: grid;
        place-items: center;
        font-size: 0.6rem;
        color: var(--muted);
        text-align: center;
        padding: 4px;
      }
      .member-main { font-size: 0.85rem; display: grid; gap: 2px; min-width: 0; }
      .line-strong { font-weight: 700; }
      .hp { color: var(--ok); }
      .muted { color: var(--muted); }
      .mp { font-size: 0.78rem; word-break: break-word; }
      .menu-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .mode-hint {
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .mode-hint.active {
        color: var(--accent);
        font-weight: 700;
      }
      .member-card.row-mode {
        cursor: pointer;
      }
      .member-card.row-mode:hover,
      .member-card.row-mode:focus-visible {
        outline: 2px solid rgba(255, 229, 136, 0.85);
        outline-offset: 1px;
      }
      .resource-row {
        display: grid;
        gap: 4px;
        font-size: 0.95rem;
      }
      .empty {
        border: 1px dashed rgba(255,255,255,0.4);
        border-radius: 8px;
        padding: 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="frame">
        <div class="toolbar">
          <h1 class="title" style="margin:0;">MENU</h1>
          <button id="backBtn" class="btn" type="button">Location選択へ戻る</button>
        </div>
      </section>

      <section class="frame">
        <h2 class="title">PARTY</h2>
        <div id="partyList" class="party-list"></div>
      </section>

      <section class="frame">
        <div id="menuButtons" class="menu-buttons"></div>
        <input id="menuLoadSaveInput" type="file" accept="application/json,.json" style="display:none;" />
        <div id="modeHint" class="mode-hint" aria-live="polite"></div>
      </section>

      <section class="frame">
        <div id="resourceRow" class="resource-row"></div>
      </section>
    </main>

    <script type="module" src="./menu.js"></script>
  </body>
</html>
