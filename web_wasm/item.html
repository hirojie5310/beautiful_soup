<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アイテム</title>
    <style>
      :root {
        --bg: #050817;
        --panel: rgba(16, 24, 56, 0.96);
        --panel-soft: rgba(22, 36, 95, 0.94);
        --text: #eef2ff;
        --muted: #acb6d7;
        --accent: #ffe588;
        --ok: #89f0ac;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #1c2b7a 0%, transparent 45%), var(--bg);
        color: var(--text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      }
      .layout {
        width: min(440px, 100vw);
        min-height: 100vh;
        margin: 0 auto;
        padding: 10px;
        display: grid;
        gap: 10px;
        align-content: start;
      }
      .frame {
        border: 2px solid rgba(255,255,255,0.45);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px;
      }
      .toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
      .title { margin: 0; color: var(--accent); font-size: 1rem; }
      .btn {
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 8px;
        color: var(--text);
        background: linear-gradient(180deg, #4459bf, #20317e);
        padding: 8px 10px;
        cursor: pointer;
        font-size: 0.88rem;
      }
      .btn.active { color: var(--accent); box-shadow: inset 0 0 0 2px rgba(255,229,136,0.5); }
      .mode-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .item-list { display: grid; gap: 6px; max-height: 35vh; overflow: auto; }
      .item-row {
        border: 1px solid rgba(255,255,255,0.32);
        border-radius: 6px;
        background: rgba(0,0,0,0.2);
        color: var(--text);
        min-height: 36px;
        padding: 6px 8px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        cursor: pointer;
      }
      .item-row.sel { box-shadow: inset 0 0 0 2px rgba(255,227,127,0.6); }
      .target-list { display: grid; gap: 6px; }
      .target-row {
        border: 1px solid rgba(255,255,255,0.32);
        color: var(--text);
        border-radius: 6px;
        background: var(--panel-soft);
        padding: 7px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        cursor: pointer;
      }
      .name { font-weight: 700; color: var(--text); }
      .hp { color: var(--ok); font-size: 0.86rem; }
      .icon-row { display: flex; gap: 4px; justify-content: flex-end; min-height: 16px; }
      .status-icon { width: 16px; height: 16px; image-rendering: pixelated; }
      .desc { color: var(--muted); font-size: 0.84rem; }
      .eq-tag { color: #9aa3bf; }
      .empty { color: var(--muted); border: 1px dashed rgba(255,255,255,0.3); border-radius: 6px; padding: 8px; }
      .footer { display: grid; grid-template-columns: 1fr; gap: 8px; }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="frame toolbar">
        <h1 class="title">ITEM</h1>
        <button class="btn" type="button" id="backBtn">BACK</button>
        <div id="memberName" class="desc">-</div>
      </section>

      <section class="frame mode-row" id="modeRow"></section>

      <section class="frame">
        <div id="itemTitle" class="desc">所持アイテム</div>
        <div class="item-list" id="itemList"></div>
      </section>

      <section class="frame">
        <div class="desc">対象キャラクター</div>
        <div class="target-list" id="targetList"></div>
      </section>

      <section class="frame desc" id="messageLine">モードを選んで操作してください。</section>

      <section class="frame footer">
        <div class="desc" id="sortLine">A→Z</div>
      </section>
    </main>

    <script type="module" src="./item.js?v=20260330-1"></script>
  </body>
</html>
