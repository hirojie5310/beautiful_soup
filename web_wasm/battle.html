<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Wasm Runner</title>
    <style>
      :root { --bg:#050817; --text:#eef2ff; --muted:#acb6d7; --accent:#ffe588; --ok:#89f0ac; }
      * { box-sizing: border-box; }
      body { margin:0; background: radial-gradient(circle at 20% 0%, #1c2b7a 0%, transparent 45%), var(--bg); color:var(--text); font-family:"BIZ UDPGothic","Yu Gothic UI",sans-serif; }
      .layout { width:min(860px,100vw); margin:0 auto; min-height:100vh; padding:10px; display:grid; gap:10px; grid-template-rows:auto auto auto 1fr; }
      .frame { border:2px solid rgba(255,255,255,.45); border-radius:10px; background:rgba(16,24,56,.95); padding:10px; }
      #enemyFrame { background-size:cover; background-position:center; }
      .title{ margin:0 0 8px; color:var(--accent); font-size:.95rem; }
      .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .btn { border:1px solid rgba(255,255,255,.7); border-radius:8px; color:var(--text); background:linear-gradient(180deg,#4459bf,#20317e); padding:8px 10px; cursor:pointer; }
      .status { color:var(--muted); font-size:.9rem; }
      .party-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
      .enemy-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
      .card { border:1px solid rgba(255,255,255,.35); border-radius:8px; padding:8px; background:rgba(0,0,0,.25); }
      .card.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,229,136,.35) inset; }
      .card.target { cursor:pointer; }
      .card.selected { border-color:var(--accent); }
      .party-card,.enemy-card{ position:relative; overflow:hidden; min-height:112px; isolation:isolate; background-size:cover; background-position:center; background-repeat:no-repeat; }
      .party-card::after,.enemy-card::after{ content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(180deg, rgba(3,6,19,0.58), rgba(3,6,19,0.72)); }
      .party-face,.enemy-sprite{ position:absolute; inset:0; width:100%; height:100%; opacity:.9; filter:brightness(.55) saturate(.95); z-index:0; }
      .party-face{ object-fit:cover; object-position:center 22%; }
      .enemy-sprite{ object-fit:contain; object-position:center; }
      .party-face-fallback,.enemy-sprite-fallback{ position:absolute; inset:0; display:grid; place-items:center; background:rgba(4,8,24,.78); color:var(--muted); font-size:.7rem; z-index:0; }
      .party-card-content,.enemy-card-content{ position:relative; z-index:2; text-shadow:0 1px 4px rgba(0,0,0,.82); display:flex; flex-direction:column; gap:2px; }
      .party-name-row { order: 1; }
      .party-hp-row { order: 2; }
      .party-level-row { order: 3; }
      .party-status-icons-row { order: 4; min-height: 16px; }
      .name { font-weight:700; font-size:.86rem; }
      .hp { font-size:.78rem; color:var(--ok); }
      .combat-popup-layer { position:absolute; inset:0; z-index:3; pointer-events:none; }
      .combat-popup { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); font-weight:700; font-size:1.3rem; color:#ffb3b3; text-shadow:0 2px 6px rgba(0,0,0,.9); letter-spacing:.03em; animation:combat-popup-rise .45s ease-out both; }
      .combat-popup.heal { color:#9ff7ba; }
      .combat-popup.miss { color:#ffe588; font-size:1rem; }
      @keyframes combat-popup-rise {
        from { opacity:0; transform:translate(-50%,-20%); }
        to { opacity:1; transform:translate(-50%,-60%); }
      }
      .command-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .command-grid.command-mode { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .magic-group-header { padding:2px 6px 2px 2px; color:var(--accent); font-size:.84rem; font-weight:700; white-space:nowrap; }
      .magic-group-row { grid-column:1/-1; display:flex; align-items:center; gap:8px; }
      .magic-group-spells { display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; }
      pre { margin:0; border:1px solid rgba(255,255,255,.28); border-radius:8px; background:#0b1229; max-height:300px; overflow:auto; white-space:pre-wrap; padding:8px; line-height:1.45; }
      .reward { border:1px solid rgba(255,229,136,.5); background:rgba(255,229,136,.09); border-radius:8px; padding:8px; display:none; }
      .reward.open { display:block; }
      .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="frame">
        <h1 class="title">Battle Wasm Runner</h1>
        <div class="toolbar">
          <span id="battlePhase" class="status">起動中...</span>
          <button id="locationBtn" class="btn" type="button">Location選択</button>
          <button id="menuBtn" class="btn" type="button">メニュー</button>
          <button id="loadSaveBtn" class="btn" type="button">ロード</button>
          <input id="loadSaveInput" type="file" accept="application/json,.json" style="display:none;" />
        </div>
      </section>
      <section class="frame"><h2 class="title">PARTY</h2><div id="partyGrid" class="party-grid"></div></section>
      <section id="enemyFrame" class="frame"><h2 class="title">ENEMY（対象を選択）</h2><div id="enemyGrid" class="enemy-grid"></div></section>
      <section id="commandFrame" class="frame">
        <h2 class="title">COMMAND</h2>
        <div id="statusLine" class="status">エンジン起動中です...</div>
        <div id="commandGrid" class="command-grid"></div>
        <h3 class="title" style="margin-top:10px;">Planned Actions</h3>
        <pre id="plannedActionsView" class="mono">(none)</pre>
      </section>
      <section id="battleLogFrame" class="frame" style="display:none;">
        <div class="toolbar" style="justify-content:space-between; margin-top:10px;">
          <h3 class="title" style="margin:0;">Battle Logs</h3>
          <button id="downloadSaveBtn" class="btn" type="button">保存</button>
        </div>
        <pre id="logView">(not executed)</pre>
        <div id="rewardPanel" class="reward" style="margin-top:10px;"></div>
      </section>
    </main>
    <script type="module" src="./battle.js?v=20260402b"></script>
  </body>
</html>
