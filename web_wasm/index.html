<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Wasm Runner</title>
    <style>
      :root {
        --bg: #050817;
        --panel: #101838;
        --text: #eef2ff;
        --muted: #acb6d7;
        --accent: #ffe588;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #1c2b7a 0%, transparent 45%), var(--bg);
        color: var(--text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      }
      .layout {
        width: min(860px, 100vw);
        margin: 0 auto;
        min-height: 100vh;
        padding: 10px;
      }
      .screen {
        width: 100%;
        min-height: calc(100vh - 20px);
        display: grid;
        gap: 10px;
        align-content: start;
      }
      .screen.narrow { width: min(440px, 100%); margin: 0 auto; }
      .screen.medium { width: min(760px, 100%); margin: 0 auto; }
      .frame {
        width: 100%;
        border: 2px solid rgba(255,255,255,0.45);
        border-radius: 10px;
        background: rgba(16, 24, 56, 0.95);
        padding: 16px;
      }
      .title { margin: 0 0 12px; color: var(--accent); font-size: 1rem; }
      .status { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
      .selector-row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      select {
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.5);
        background: #0b1229;
        color: var(--text);
        padding: 8px;
      }
      .buttons {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 8px;
        color: var(--text);
        background: linear-gradient(180deg, #4459bf, #20317e);
        padding: 8px 12px;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .shop-grid {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px;
        align-items: center;
      }
      .resource-line {
        color: var(--accent);
        font-size: 0.92rem;
        margin: 0 0 10px;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 10px 0 0;
        min-height: 1.4em;
      }
      .party-list {
        display: grid;
        gap: 8px;
      }
      .member-card {
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 8px;
        background: rgba(0,0,0,0.26);
        padding: 8px;
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 8px;
      }
      .portrait {
        width: 72px;
        height: 72px;
        object-fit: cover;
        object-position: center 20%;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.08);
      }
      .portrait-fallback {
        width: 72px;
        height: 72px;
        border-radius: 6px;
        border: 1px dashed rgba(255,255,255,0.55);
        display: grid;
        place-items: center;
        font-size: 0.6rem;
        color: var(--muted);
        text-align: center;
        padding: 4px;
      }
      .member-main { font-size: 0.85rem; display: grid; gap: 2px; min-width: 0; }
      .line-strong { font-weight: 700; }
      .hp { color: #89f0ac; }
      .menu-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .mode-hint {
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .mode-hint.active {
        color: var(--accent);
        font-weight: 700;
      }
      .member-card.row-mode {
        cursor: pointer;
      }
      .member-card.row-mode:hover,
      .member-card.row-mode:focus-visible {
        outline: 2px solid rgba(255, 229, 136, 0.85);
        outline-offset: 1px;
      }
      .resource-row {
        display: grid;
        gap: 4px;
        font-size: 0.95rem;
      }
      .empty {
        border: 1px dashed rgba(255,255,255,0.4);
        border-radius: 8px;
        padding: 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 560px) {
        .selector-row,
        .shop-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="app" class="layout" aria-live="polite"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
