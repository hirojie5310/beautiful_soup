<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Wasm Runner - Location Select</title>
    <style>
      :root {
        --bg: #050817;
        --panel: #101838;
        --text: #eef2ff;
        --muted: #acb6d7;
        --accent: #ffe588;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #1c2b7a 0%, transparent 45%), var(--bg);
        color: var(--text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      }
      .layout {
        width: min(760px, 100vw);
        margin: 0 auto;
        min-height: 100vh;
        padding: 10px;
        display: grid;
        place-items: center;
      }
      .frame {
        width: 100%;
        border: 2px solid rgba(255,255,255,0.45);
        border-radius: 10px;
        background: rgba(16, 24, 56, 0.95);
        padding: 16px;
      }
      .title { margin: 0 0 12px; color: var(--accent); font-size: 1rem; }
      .status { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
      .selector-row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .shop-frame {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.18);
      }
      .shop-grid {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px;
        align-items: center;
      }
      .shop-title {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 0.95rem;
      }
      .shop-meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 10px 0 0;
        min-height: 1.4em;
      }
      .inn-frame {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid rgba(255,255,255,0.18);
      }
      .resource-line {
        color: var(--accent);
        font-size: 0.92rem;
        margin: 0 0 10px;
      }
      select {
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.5);
        background: #0b1229;
        color: var(--text);
        padding: 8px;
      }
      .buttons {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 8px;
        color: var(--text);
        background: linear-gradient(180deg, #4459bf, #20317e);
        padding: 8px 12px;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      @media (max-width: 560px) {
        .selector-row,
        .shop-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="frame">
        <h1 class="title">Battle Wasm Runner / Location選択</h1>
        <div id="statusLine" class="status">起動中...</div>

        <div class="selector-row">
          <label for="locationGroupSelect">LocationGroup</label>
          <select id="locationGroupSelect"></select>
          <label for="locationSelect">Location</label>
          <select id="locationSelect"></select>
        </div>

        <div class="buttons">
          <button id="startBattleBtn" class="btn" type="button" disabled>戦闘開始</button>
          <button id="menuBtn" class="btn" type="button">メニュー</button>
        </div>

        <section class="shop-frame">
          <h2 class="shop-title">Shop</h2>
          <div id="shopGilLine" class="resource-line">GIL ---</div>
          <div class="shop-grid">
            <label for="shopMapSelect">map</label>
            <select id="shopMapSelect"></select>
            <label for="shopTypeSelect">type</label>
            <select id="shopTypeSelect"></select>
            <label for="shopGoodsSelect">goods</label>
            <select id="shopGoodsSelect"></select>
          </div>
          <div class="buttons">
            <button id="buyShopBtn" class="btn" type="button" disabled>購入</button>
          </div>
          <div id="shopStatusLine" class="shop-meta"></div>
        </section>

        <section class="inn-frame">
          <h2 class="shop-title">Inn</h2>
          <div class="resource-line">宿泊料 10 GIL</div>
          <div class="buttons">
            <button id="stayInnBtn" class="btn" type="button">宿泊</button>
          </div>
          <div id="innStatusLine" class="shop-meta"></div>
        </section>
      </section>
    </main>

    <script type="module" src="./location.js?v=20260404-shop1"></script>
  </body>
</html>
