<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Wasm Runner - Inn</title>
    <style>
      :root {
        --bg: #050817;
        --panel: #101838;
        --text: #eef2ff;
        --muted: #acb6d7;
        --accent: #ffe588;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #1c2b7a 0%, transparent 45%), var(--bg);
        color: var(--text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
      }
      .layout {
        width: min(760px, 100vw);
        margin: 0 auto;
        min-height: 100vh;
        padding: 10px;
        display: grid;
        place-items: center;
      }
      .frame {
        width: 100%;
        border: 2px solid rgba(255,255,255,0.45);
        border-radius: 10px;
        background: rgba(16, 24, 56, 0.95);
        padding: 16px;
      }
      .title { margin: 0 0 12px; color: var(--accent); font-size: 1rem; }
      .status { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }
      .resource-line {
        color: var(--accent);
        font-size: 0.92rem;
        margin: 0 0 10px;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 10px 0 0;
        min-height: 1.4em;
      }
      .buttons {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 8px;
        color: var(--text);
        background: linear-gradient(180deg, #4459bf, #20317e);
        padding: 8px 12px;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="frame">
        <h1 class="title">Battle Wasm Runner / Inn</h1>
        <div id="statusLine" class="status">起動中...</div>
        <div id="selectedLocationLine" class="status"></div>
        <div id="gilLine" class="resource-line">GIL ---</div>
        <div class="resource-line">宿泊料 10 GIL</div>

        <div class="buttons">
          <button id="stayInnBtn" class="btn" type="button" disabled>宿泊</button>
          <button id="backBtn" class="btn" type="button">Locationへ戻る</button>
          <button id="menuBtn" class="btn" type="button">メニュー</button>
        </div>
        <div id="innStatusLine" class="meta"></div>
      </section>
    </main>

    <script type="module" src="./inn.js?v=20260405-inn-split1"></script>
  </body>
</html>
