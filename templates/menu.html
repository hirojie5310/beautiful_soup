<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Menu</title>
    <style>
      :root {
        --bg: #04081d;
        --panel: rgba(15, 23, 66, 0.94);
        --panel-deep: rgba(7, 12, 37, 0.9);
        --border: rgba(233, 240, 255, 0.7);
        --text: #f4f7ff;
        --muted: #b2bcdf;
        --accent: #ffe37f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        background: radial-gradient(circle at 20% 0%, #1a2b84 0%, transparent 45%), var(--bg);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
        color: var(--text);
        padding: 8px;
      }
      .menu-root {
        width: min(100vw, 480px);
      }
      .window {
        border: 2px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 142px;
        gap: 6px;
      }
      .party-panel { padding: 6px; }
      .member-row {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 8px;
        align-items: center;
        padding: 3px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
      }
      .member-row + .member-row { margin-top: 4px; }
      .member-row.row-selected {
        outline: 2px solid rgba(255, 227, 127, 0.9);
        box-shadow: 0 0 0 2px rgba(255, 227, 127, 0.35);
      }
      .portrait-frame {
        width: 92px;
        height: 72px;
        background: linear-gradient(90deg, rgba(255, 227, 127, 0.25) 24%, rgba(255, 255, 255, 0.08) 24%);
        border: 1px solid rgba(233, 240, 255, 0.45);
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .portrait-wrap {
        width: 100%;
        transition: transform 0.15s ease;
      }
      .portrait-wrap.row-front { transform: translateX(0); }
      .portrait-wrap.row-back { transform: translateX(12px); }
      .portrait {
        width: 64px;
        height: 64px;
        object-fit: cover;
        margin-left: 8px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
      }
      .name { font-size: 18px; font-weight: 700; line-height: 1.1; }
      .job, .lv { font-size: 11px; line-height: 1.2; color: var(--muted); }
      .hp { font-size: 16px; color: var(--accent); line-height: 1.15; }

      .menu-side {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 6px;
      }
      .menu-panel { padding: 10px 10px; }
      .menu-item {
        display: block;
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        line-height: 2;
      }
      .menu-item.active { color: #fff; text-shadow: 0 0 8px rgba(255, 227, 127, 0.5); }
      .resource-panel {
        padding: 10px;
        font-size: 16px;
        line-height: 1.35;
        background: var(--panel-deep);
      }

      .bottom {
        margin-top: 6px;
        padding: 8px 10px;
        font-size: 16px;
      }
      .message {
        margin-top: 6px;
        min-height: 24px;
        font-size: 14px;
        color: var(--accent);
      }
      .toolbar {
        margin-bottom: 6px;
      }
      .toolbar a {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="menu-root">
      <div class="toolbar"><a href="/">← Battle API Playgroundへ戻る</a></div>
      <div class="top">
        <section class="window party-panel" id="partyPanel"></section>
        <div class="menu-side">
          <section class="window menu-panel" id="menuPanel"></section>
          <section class="window resource-panel"><div id="metaCp">CP ???</div><div id="metaGil">GIL ???</div></section>
        </div>
      </div>
      <section class="window bottom">
        <div id="menuHelp">↑ ↓: Select　Enter: OK　Esc: Back</div>
        <div class="message" id="menuMessage"></div>
      </section>
    </div>

    <script id="initialMenuStateJson" type="application/json">{{ initial_menu_state|tojson }}</script>
    <script>
      const menuItems = ["アイテム", "まほう", "そうび", "ステータス", "ならびかえ", "ジョブ", "セーブ"];
      const menuRoutes = {
        アイテム: "/menu/item",
        まほう: "/menu/magic",
        そうび: "/menu/equip",
        ステータス: "/menu/status",
        ジョブ: "/menu/job",
      };
      const partyPanel = document.getElementById("partyPanel");
      const menuPanel = document.getElementById("menuPanel");
      const menuHelp = document.getElementById("menuHelp");
      const menuMessage = document.getElementById("menuMessage");
      const metaCp = document.getElementById("metaCp");
      const metaGil = document.getElementById("metaGil");
      const initialMenuStateNode = document.getElementById("initialMenuStateJson");

      let menuState = { party: [], resources: {} };
      let mode = "menu";
      let idx = 0;
      let rowMemberIdx = 0;

      function parseInitialMenuState() {
        try {
          const parsed = JSON.parse(initialMenuStateNode.textContent || "{}");
          if (parsed && typeof parsed === "object") {
            menuState = parsed;
          }
        } catch (error) {
          menuMessage.textContent = `初期データの読込に失敗: ${error}`;
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
      function resolvePortraitUrl(portraitKey) {
        return portraitKey ? `/assets/portraits/${encodeURIComponent(String(portraitKey))}` : "";
      }

      function refreshMeta() {
        const cp = menuState?.resources?.cp;
        const cpMax = menuState?.resources?.cp_max;
        const gil = menuState?.resources?.gil;
        metaCp.textContent = Number.isFinite(cp) && Number.isFinite(cpMax) ? `CP ${cp}/${cpMax}` : "CP ???";
        metaGil.textContent = Number.isFinite(gil) ? `GIL ${gil.toLocaleString()}` : "GIL ???";
      }

      function renderParty() {
        const party = Array.isArray(menuState?.party) ? menuState.party : [];
        if (!party.length) {
          partyPanel.innerHTML = '<div class="name">No party members</div>';
          return;
        }
        partyPanel.innerHTML = party
          .map((member, i) => {
            const rowClass = String(member.row || "front") === "back" ? "row-back" : "row-front";
            const selected = mode === "row" && i === rowMemberIdx;
            const portraitUrl = resolvePortraitUrl(member.portrait_key);
            return `<div class="member-row ${selected ? "row-selected" : ""}" data-member-index="${i}">
              <div class="portrait-frame"><div class="portrait-wrap ${rowClass}">${portraitUrl ? `<img class="portrait" src="${portraitUrl}" alt="${escapeHtml(member.name)}" />` : ""}</div></div>
              <div>
                <div class="name">${escapeHtml(member.name)}</div>
                <div class="job">${escapeHtml(member.job)}</div>
                <div class="lv">LV${Number(member.level || 0)} / ${escapeHtml(member.row || "front")}</div>
                <div class="hp">${Number(member.hp || 0)}/${Number(member.max_hp || 0)}</div>
              </div>
            </div>`;
          })
          .join("");
      }

      function renderMenu() {
        menuPanel.innerHTML = menuItems
          .map((name, i) => `<a class="menu-item ${mode === "menu" && i === idx ? "active" : ""}" data-menu-index="${i}" href="#">${mode === "menu" && i === idx ? "▶" : "　"}${name}</a>`)
          .join("");
        if (mode === "row") {
          menuHelp.textContent = "↑ ↓: キャラ選択　Enter: 前列/後列切替　Esc: Back";
        } else {
          menuHelp.textContent = "↑ ↓: Select　Enter: OK　Esc: Back";
        }
      }

      function render() {
        renderParty();
        renderMenu();
        refreshMeta();
      }

      async function refreshState() {
        const resp = await fetch("/menu/state");
        menuState = await resp.json();
        render();
      }

      async function toggleRow(memberIndex) {
        const resp = await fetch("/menu/toggle-row", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ member_index: memberIndex }),
        });
        const body = await resp.json();
        if (body && body.menu_state) {
          menuState = body.menu_state;
        }
        const row = menuState?.party?.[memberIndex]?.row;
        menuMessage.textContent = `ならびかえ: ${menuState?.party?.[memberIndex]?.name || "member"} を${row === "back" ? "後列" : "前列"}に変更しました。`;
        render();
      }

      async function saveGame() {
        const resp = await fetch("/menu/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        if (resp.ok) {
          menuMessage.textContent = "セーブしました。";
        } else {
          menuMessage.textContent = "セーブに失敗しました。";
        }
      }

      async function executeCurrentMenu() {
        const current = menuItems[idx];
        if (current in menuRoutes) {
          window.location.href = menuRoutes[current];
          return;
        }
        if (current === "ならびかえ") {
          mode = "row";
          rowMemberIdx = 0;
          render();
          return;
        }
        if (current === "セーブ") {
          const confirmed = window.confirm("セーブしますか？");
          if (confirmed) {
            await saveGame();
          } else {
            menuMessage.textContent = "セーブをキャンセルしました。";
          }
        }
      }

      document.addEventListener("keydown", async (event) => {
        if (["ArrowUp", "ArrowDown", "Enter", "Escape"].includes(event.key)) event.preventDefault();
        if (mode === "menu") {
          if (event.key === "ArrowUp") idx = (idx - 1 + menuItems.length) % menuItems.length;
          if (event.key === "ArrowDown") idx = (idx + 1) % menuItems.length;
          if (event.key === "Enter") await executeCurrentMenu();
          if (event.key === "Escape") window.location.href = "/";
        } else if (mode === "row") {
          const partyLen = Array.isArray(menuState?.party) ? menuState.party.length : 0;
          if (!partyLen) {
            mode = "menu";
          } else {
            if (event.key === "ArrowUp") rowMemberIdx = (rowMemberIdx - 1 + partyLen) % partyLen;
            if (event.key === "ArrowDown") rowMemberIdx = (rowMemberIdx + 1) % partyLen;
            if (event.key === "Enter") await toggleRow(rowMemberIdx);
            if (event.key === "Escape") mode = "menu";
          }
        }
        render();
      });

      menuPanel.addEventListener("click", async (event) => {
        const item = event.target.closest("[data-menu-index]");
        if (!item) return;
        event.preventDefault();
        idx = Number(item.getAttribute("data-menu-index") || "0");
        await executeCurrentMenu();
        render();
      });

      partyPanel.addEventListener("click", async (event) => {
        if (mode !== "row") return;
        const row = event.target.closest("[data-member-index]");
        if (!row) return;
        rowMemberIdx = Number(row.getAttribute("data-member-index") || "0");
        await toggleRow(rowMemberIdx);
        render();
      });

      parseInitialMenuState();
      refreshState().catch(() => render());
    </script>
  </body>
</html>
