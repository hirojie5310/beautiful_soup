<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>まほう</title>
    <style>
      :root { --bg:#04081d; --panel:rgba(15,23,66,.94); --panel-soft:rgba(22,36,95,.94); --border:rgba(233,240,255,.72); --text:#f4f7ff; --muted:#c3cdec; --accent:#ffe37f; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--text); font-family:"BIZ UDPGothic","Yu Gothic UI",sans-serif; background: radial-gradient(circle at 20% 0%, #1a2b84 0%, transparent 45%), var(--bg); }
      .magic-layout { width:min(980px,100vw); min-height:100vh; margin:0 auto; padding:10px; display:grid; grid-template-rows:auto auto 1fr auto auto; gap:8px; }
      .frame { border:2px solid var(--border); border-radius:12px; background:var(--panel); }
      .tabs { display:grid; grid-template-columns:repeat(5,1fr); min-height:92px; }
      .tab { border-right:2px solid rgba(233,240,255,.2); display:grid; place-items:center; font-size:1.75rem; font-weight:700; cursor:pointer; }
      .tab:last-child { border-right:0; }
      .tab.active { color:var(--accent); box-shadow:inset 0 0 0 2px rgba(255,227,127,.33); }
      .member-strip { min-height:84px; display:grid; grid-template-columns:1fr 1fr; align-items:center; padding:0 20px; font-size:1.8rem; font-weight:700; }
      .magic-grid { background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.22)), var(--panel-soft); overflow:hidden; }
      .grid-head, .grid-row { display:grid; grid-template-columns:140px repeat(3, 1fr); }
      .grid-head > div, .grid-row > div { min-height:64px; display:flex; align-items:center; padding:0 12px; border-right:2px solid rgba(233,240,255,.2); border-bottom:2px solid rgba(233,240,255,.2); }
      .grid-head > div:last-child, .grid-row > div:last-child { border-right:0; }
      .grid-head { color:var(--muted); font-size:1.02rem; }
      .grid-row { font-size:1.3rem; }
      .lv.sel, .slot.sel, .stock.sel, .target-card.sel { box-shadow:inset 0 0 0 2px rgba(255,227,127,.5); }
      .lv, .slot, .stock, .target-card { cursor:pointer; }
      .stock-pane { min-height:92px; padding:12px 18px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
      .stock, .target-card { border:1px solid rgba(233,240,255,.25); border-radius:8px; padding:8px; display:grid; gap:4px; }
      .desc { min-height:78px; padding:16px 20px; font-size:1.5rem; }
      .footer { display:grid; grid-template-columns:1fr 1.7fr 1fr; min-height:86px; }
      .footer button { width:100%; border:0; border-right:2px solid rgba(233,240,255,.25); border-left:2px solid rgba(233,240,255,.25); background:transparent; color:var(--text); font:inherit; font-size:2rem; font-weight:700; cursor:pointer; }
      .footer .side { color:var(--muted); font-size:1.2rem; }
      .help { text-align:center; color:var(--muted); font-size:.96rem; margin-top:6px; }
    </style>
  </head>
  <body>
    <main class="magic-layout" id="magicScreen">
      <section class="frame tabs" id="tabs">
        <div class="tab">まほう</div>
        <div class="tab" data-action="use">つかう</div>
        <div class="tab active" data-action="learn">おぼえる</div>
        <div class="tab" data-action="remove">はずす</div>
        <div class="tab" data-action="swap">こうかん</div>
      </section>

      <section class="frame member-strip">
        <div id="memberName">-</div>
        <div id="memberJob">-</div>
      </section>

      <section class="frame magic-grid" id="magicGrid"></section>
      <section class="frame stock-pane" id="stockPane"></section>
      <section class="frame desc" id="desc">-</section>

      <section class="frame footer">
        <button type="button" class="side" id="prevBtn">◀</button>
        <button type="button" id="backBtn">もどる</button>
        <button type="button" class="side" id="nextBtn">▶</button>
      </section>
      <p class="help" id="help">←→: キャラ切替 / ↑↓: Lv / Enter: 実行 / Backspace: 戻る</p>
    </main>

    <script id="initialMenuStateJson" type="application/json">{{ initial_menu_state | tojson }}</script>
    <script>
      const initialMenuStateNode = document.getElementById("initialMenuStateJson");
      let menuState = { party: [], magic_setup: { stock_by_level: {}, equipped_by_member: [] } };
      let memberIdx = 0;
      let lvIdx = 1;
      let slotSel = 0;
      let stockSel = 0;
      let targetSel = 0;
      let action = "learn";
      let phase = "slot"; // slot | stock | target

      const memberName = document.getElementById("memberName");
      const memberJob = document.getElementById("memberJob");
      const magicGrid = document.getElementById("magicGrid");
      const stockPane = document.getElementById("stockPane");
      const desc = document.getElementById("desc");
      const help = document.getElementById("help");

      function parseInitialState() {
        try { menuState = JSON.parse(initialMenuStateNode.textContent || "{}"); }
        catch (_e) { menuState = { party: [], magic_setup: { stock_by_level: {}, equipped_by_member: [] } }; }
      }
      function currentMember() { return (menuState.party || [])[memberIdx] || {}; }
      function setup() { return menuState.magic_setup || { stock_by_level: {}, equipped_by_member: [] }; }
      function equippedByMember(member, lv) { return setup().equipped_by_member?.[member]?.[String(lv)] || [null, null, null]; }
      function stockByLevel(lv) { return setup().stock_by_level?.[String(lv)] || []; }
      function goMenu() { window.location.assign("/menu"); }

      function renderTabs() {
        document.querySelectorAll("#tabs .tab[data-action]").forEach((el) => {
          el.classList.toggle("active", el.dataset.action === action);
        });
      }

      function render() {
        const party = Array.isArray(menuState?.party) ? menuState.party : [];
        if (!party.length) return;
        memberIdx = ((memberIdx % party.length) + party.length) % party.length;
        memberName.textContent = currentMember().name || "-";
        memberJob.textContent = currentMember().job || "-";
        renderTabs();

        let html = '<div class="grid-head"><div>LV</div><div>セット1</div><div>セット2</div><div>セット3</div></div>';
        for (let lv = 1; lv <= 8; lv += 1) {
          const row = equippedByMember(memberIdx, lv);
          html += `<div class="grid-row"><div class="lv ${phase === "slot" && lvIdx === lv ? "sel" : ""}" data-lv="${lv}">LV ${lv}</div>`;
          for (let i = 0; i < 3; i += 1) {
            const nm = row[i] || "（空）";
            const sel = phase === "slot" && lvIdx === lv && slotSel === i;
            html += `<div class="slot ${sel ? "sel" : ""}" data-lv="${lv}" data-slot="${i}">${nm}</div>`;
          }
          html += `</div>`;
        }
        magicGrid.innerHTML = html;

        if (action === "learn") {
          const stock = stockByLevel(lvIdx);
          stockSel = Math.max(0, Math.min(stockSel, Math.max(stock.length - 1, 0)));
          stockPane.innerHTML = stock.length
            ? stock.map((name, i) => `<div class="stock ${phase === "stock" && i === stockSel ? "sel" : ""}" data-stock="${i}">${name}</div>`).join("")
            : '<div class="stock">このLvに在庫はありません。</div>';
        } else if ((action === "swap" || action === "use") && phase === "target") {
          targetSel = Math.max(0, Math.min(targetSel, Math.max(party.length - 1, 0)));
          stockPane.innerHTML = party.map((m, i) => `<div class="target-card ${i === targetSel ? "sel" : ""}" data-target="${i}"><div>${m.name || "-"}</div><div>${m.job || "-"}</div></div>`).join("");
        } else {
          stockPane.innerHTML = '<div class="stock">操作モードに応じてここに候補が表示されます。</div>';
        }

        const modeLabel = action === "learn"
          ? "おぼえる"
          : action === "use"
            ? "つかう"
            : action === "remove"
              ? "はずす"
              : "こうかん";
        desc.textContent = `モード: ${modeLabel} / LV${lvIdx}`;
        help.textContent = action === "learn"
          ? "Enter: スロット→ストック→実行"
          : action === "use"
            ? "Enter: スロット→対象→使用"
            : action === "remove"
              ? "Enter: スロットを外す"
              : "Enter: スロット→交換先";
      }

      async function api(path, payload) {
        const resp = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        const body = await resp.json();
        if (body?.menu_state) menuState = body.menu_state;
        return !!body?.ok;
      }

      async function decide() {
        if (action === "learn") {
          if (phase === "slot") { phase = "stock"; render(); return; }
          const stock = stockByLevel(lvIdx);
          const spell = stock[stockSel];
          if (!spell) return;
          await api("/menu/magic/learn", { member_index: memberIdx, level: lvIdx, slot_index: slotSel, spell_name: spell });
          phase = "slot";
          render();
          return;
        }
        if (action === "use") {
          const row = equippedByMember(memberIdx, lvIdx);
          const spell = row[slotSel];
          if (!spell) return;
          if (phase === "slot") { phase = "target"; render(); return; }
          await api("/menu/magic/use", {
            caster_index: memberIdx,
            level: lvIdx,
            slot_index: slotSel,
            target_index: targetSel,
          });
          phase = "slot";
          render();
          return;
        }
        if (action === "remove") {
          await api("/menu/magic/remove", { member_index: memberIdx, level: lvIdx, slot_index: slotSel });
          render();
          return;
        }
        if (action === "swap") {
          if (phase === "slot") { phase = "target"; render(); return; }
          await api("/menu/magic/swap", { from_member_index: memberIdx, to_member_index: targetSel, level: lvIdx, slot_index: slotSel });
          phase = "slot";
          render();
        }
      }

      function moveMember(delta) {
        const party = menuState.party || [];
        if (!party.length) return;
        memberIdx = (memberIdx + delta + party.length) % party.length;
        phase = "slot";
        render();
      }
      function moveUpDown(delta) {
        if (phase === "stock") {
          const stock = stockByLevel(lvIdx);
          if (stock.length) stockSel = (stockSel + delta + stock.length) % stock.length;
        } else if (phase === "target") {
          const len = (menuState.party || []).length;
          if (len) targetSel = (targetSel + delta + len) % len;
        } else {
          lvIdx = ((lvIdx - 1 + delta + 8) % 8) + 1;
        }
        render();
      }

      document.getElementById("prevBtn").addEventListener("click", () => moveMember(-1));
      document.getElementById("nextBtn").addEventListener("click", () => moveMember(1));
      document.getElementById("backBtn").addEventListener("click", () => {
        if (phase === "stock" || phase === "target") phase = "slot";
        else goMenu();
        render();
      });

      document.getElementById("tabs").addEventListener("click", (event) => {
        const el = event.target.closest("[data-action]");
        if (!el) return;
        action = el.dataset.action;
        phase = "slot";
        render();
      });

      magicGrid.addEventListener("click", (event) => {
        const lvEl = event.target.closest("[data-lv]");
        const slotEl = event.target.closest("[data-slot]");
        if (lvEl) lvIdx = Math.max(1, Math.min(8, Number(lvEl.dataset.lv || lvIdx)));
        if (slotEl) slotSel = Math.max(0, Math.min(2, Number(slotEl.dataset.slot || 0)));
        phase = "slot";
        render();
      });

      stockPane.addEventListener("click", (event) => {
        const stockEl = event.target.closest("[data-stock]");
        if (stockEl) { stockSel = Math.max(0, Number(stockEl.dataset.stock || 0)); phase = "stock"; }
        const targetEl = event.target.closest("[data-target]");
        if (targetEl) { targetSel = Math.max(0, Number(targetEl.dataset.target || 0)); phase = "target"; }
        render();
      });

      window.addEventListener("keydown", async (event) => {
        if (event.key === "ArrowLeft") { event.preventDefault(); moveMember(-1); }
        else if (event.key === "ArrowRight") { event.preventDefault(); moveMember(1); }
        else if (event.key === "ArrowUp") { event.preventDefault(); moveUpDown(-1); }
        else if (event.key === "ArrowDown") { event.preventDefault(); moveUpDown(1); }
        else if (event.key === "Enter") { event.preventDefault(); await decide(); }
        else if (event.key === "Backspace") {
          event.preventDefault();
          if (phase === "stock" || phase === "target") phase = "slot";
          else goMenu();
          render();
        } else if (event.key === "Escape") { event.preventDefault(); goMenu(); }
      });

      parseInitialState();
      render();
    </script>
  </body>
</html>
