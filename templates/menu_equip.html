<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>そうび</title>
    <style>
      :root {
        --bg: #04081d;
        --panel: rgba(15, 23, 66, 0.94);
        --panel-soft: rgba(22, 36, 95, 0.94);
        --border: rgba(233, 240, 255, 0.72);
        --text: #f4f7ff;
        --muted: #c3cdec;
        --accent: #ffe37f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
        background: radial-gradient(circle at 20% 0%, #1a2b84 0%, transparent 45%), var(--bg);
      }
      .equip-layout { width: min(980px, 100vw); min-height: 100vh; margin: 0 auto; padding: 10px; display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 8px; }
      .frame { border: 2px solid var(--border); border-radius: 12px; background: var(--panel); }
      .command-bar { display: grid; grid-template-columns: repeat(4, 1fr); min-height: 92px; }
      .cmd { border: 0; border-right: 2px solid rgba(233,240,255,0.2); background: transparent; color: var(--text); font: inherit; font-size: 2rem; font-weight: 700; cursor:pointer; }
      .cmd:last-child { border-right: 0; }
      .cmd.active { color: var(--accent); box-shadow: 0 0 0 2px rgba(255,227,127,.33) inset; }
      .main-panel { padding: 14px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.22)), var(--panel-soft); }
      .summary { display: grid; grid-template-columns: 1fr 1fr; font-size: 1.9rem; margin-bottom: 8px; }
      .summary .name { font-weight: 700; }
      .upper { display: grid; grid-template-columns: 180px 1fr; gap: 10px; }
      .portrait-frame { width: 150px; aspect-ratio: 1/1; border: 2px solid rgba(255,255,255,.28); background: rgba(0,0,0,.2); padding: 6px; }
      .portrait { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; background:#111; }
      .slots-grid { border: 2px solid rgba(233,240,255,.34); border-radius: 10px; overflow: hidden; display:grid; grid-template-columns: 1fr 1fr; }
      .slot-cell { min-height: 68px; padding: 10px 12px; border-right: 2px solid rgba(233,240,255,.2); border-bottom: 2px solid rgba(233,240,255,.2); cursor: pointer; }
      .slot-cell:nth-child(2n) { border-right: 0; }
      .slot-cell.sel { box-shadow: inset 0 0 0 2px rgba(255,227,127,.45); }
      .slot-label { color: var(--muted); font-size: 1rem; }
      .slot-val { font-size: 1.7rem; margin-top: 3px; }
      .candidates { min-height: 240px; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
      .candidate { min-height: 68px; padding: 10px 12px; border-right: 2px solid rgba(233,240,255,.2); border-bottom: 2px solid rgba(233,240,255,.2); background: transparent; color: var(--text); text-align:left; font:inherit; cursor:pointer; }
      .candidate:nth-child(2n) { border-right: 0; }
      .candidate.sel { box-shadow: inset 0 0 0 2px rgba(255,227,127,.45); }
      .desc { min-height: 78px; padding: 16px 20px; font-size: 2rem; }
      .footer { display: grid; grid-template-columns: 1fr 1.7fr 1fr; min-height: 86px; }
      .footer button { width:100%; border:0; border-right: 2px solid rgba(233,240,255,.25); border-left: 2px solid rgba(233,240,255,.25); background: transparent; color: var(--text); font: inherit; font-size: 2rem; font-weight: 700; cursor:pointer; }
      .footer .side { color: var(--muted); font-size: 1.2rem; }
      .help { text-align:center; color: var(--muted); font-size: .96rem; margin-top:6px; }
      @media (max-width: 900px) {
        .cmd { font-size: 1.45rem; }
        .summary { font-size: 1.35rem; }
        .upper { grid-template-columns: 128px 1fr; }
        .portrait-frame { width: 110px; }
        .slot-val { font-size: 1.28rem; }
        .desc, .footer button { font-size: 1.35rem; }
      }
    </style>
  </head>
  <body>
    <main class="equip-layout" id="equipScreen">
      <section class="frame command-bar">
        <button type="button" class="cmd" data-cmd="equip">そうび</button>
        <button type="button" class="cmd" data-cmd="equip">そうび</button>
        <button type="button" class="cmd" data-cmd="remove">はずす</button>
        <button type="button" class="cmd" data-cmd="release">かいじょ</button>
      </section>

      <section class="frame main-panel">
        <div class="summary">
          <div class="name" id="memberName">-</div>
          <div><span id="atkText">こうげき 0</span>　　<span id="defText">ぼうぎょ 0</span></div>
        </div>

        <div class="upper">
          <div class="portrait-frame"><img class="portrait" id="memberPortrait" src="" alt="" /></div>
          <div class="slots-grid" id="slotsGrid"></div>
        </div>
      </section>

      <section class="frame candidates" id="candidateGrid"></section>
      <section class="frame desc" id="message">↑↓: スロット / Enter: 決定 / BS: もどる</section>

      <section class="frame footer">
        <button type="button" class="side" id="prevBtn">◀</button>
        <button type="button" id="backBtn">もどる</button>
        <button type="button" class="side" id="nextBtn">▶</button>
      </section>
      <p class="help">←→: キャラ切替 / ↑↓: 選択 / Enter: 実行 / Backspace: 戻る</p>
    </main>

    <script id="initialMenuStateJson" type="application/json">{{ initial_menu_state | tojson }}</script>
    <script>
      const initialMenuStateNode = document.getElementById("initialMenuStateJson");
      let menuState = { party: [], equip_candidates_by_member: [] };
      const slots = ["main_hand", "off_hand", "unequip_all", "head", "body", "arms"];
      const slotLabel = {
        main_hand: "みぎて", off_hand: "ひだりて", unequip_all: "ぜんぶはずす", head: "あたま", body: "ふく", arms: "うで"
      };

      let memberIdx = 0;
      let slotIdx = 0;
      let candIdx = 0;
      let mode = "slot"; // slot | candidate
      let cmdMode = "equip"; // equip | remove | release

      const memberName = document.getElementById("memberName");
      const atkText = document.getElementById("atkText");
      const defText = document.getElementById("defText");
      const memberPortrait = document.getElementById("memberPortrait");
      const slotsGrid = document.getElementById("slotsGrid");
      const candidateGrid = document.getElementById("candidateGrid");
      const message = document.getElementById("message");

      function parseInitialState() {
        try {
          const parsed = JSON.parse(initialMenuStateNode.textContent || "{}");
          if (parsed && typeof parsed === "object") menuState = parsed;
        } catch (_error) {
          menuState = { party: [], equip_candidates_by_member: [] };
        }
      }
      function currentMember() {
        const party = Array.isArray(menuState?.party) ? menuState.party : [];
        return party[memberIdx] || null;
      }
      function currentStatus() {
        return currentMember()?.status || {};
      }
      function equipData() {
        return currentMember()?.equipment || {};
      }
      function candidatesForSlot(slot) {
        const rows = Array.isArray(menuState?.equip_candidates_by_member)
          ? menuState.equip_candidates_by_member[memberIdx] : null;
        const list = rows && typeof rows === "object" ? rows[slot] : [];
        return Array.isArray(list) ? list : [];
      }
      function resolvePortraitUrl(key) {
        return key ? `/assets/portraits/${encodeURIComponent(String(key))}` : "";
      }
      function goMenu() { window.location.assign("/menu"); }

      function renderCommandBar() {
        document.querySelectorAll(".cmd").forEach((el, i) => {
          const modeVal = String(el.getAttribute("data-cmd") || "equip");
          el.classList.toggle("active", (i === 0 && cmdMode === "equip") || modeVal === cmdMode);
          el.onclick = () => {
            cmdMode = modeVal;
            mode = "slot";
            render();
          };
        });
      }

      function render() {
        const party = Array.isArray(menuState?.party) ? menuState.party : [];
        if (!party.length) {
          memberName.textContent = "No party members";
          slotsGrid.innerHTML = "";
          candidateGrid.innerHTML = "";
          return;
        }
        memberIdx = ((memberIdx % party.length) + party.length) % party.length;
        const member = currentMember();
        const st = currentStatus();
        const eq = equipData();

        memberName.textContent = `${member?.name || "-"}`;
        atkText.textContent = `こうげき ${Number(st?.atk_value || 0)}`;
        defText.textContent = `ぼうぎょ ${Number(st?.defense || 0)}`;

        const portraitUrl = resolvePortraitUrl(member?.portrait_key);
        if (portraitUrl) memberPortrait.src = portraitUrl; else memberPortrait.removeAttribute("src");

        slotsGrid.innerHTML = slots.map((slot, i) => {
          const sel = mode === "slot" && i === slotIdx;
          let val = "";
          if (slot === "unequip_all") {
            val = "";
          } else {
            val = eq?.[slot] || "-";
          }
          return `<div class="slot-cell ${sel ? "sel" : ""}" data-slot-index="${i}"><div class="slot-label">${slotLabel[slot]}</div><div class="slot-val">${val}</div></div>`;
        }).join("");

        const slot = slots[slotIdx] || "main_hand";
        const candidates = slot === "unequip_all" ? [{kind:"none",name:null}] : candidatesForSlot(slot);
        if (candIdx >= candidates.length) candIdx = 0;

        candidateGrid.innerHTML = candidates.map((row, i) => {
          const sel = mode === "candidate" && i === candIdx;
          const name = row?.name || "はずす";
          const stock = Number(row?.count ?? 0);
          const stockLabel = row?.name && Number.isFinite(stock) && stock > 0 ? ` x${stock}` : "";
          const sub = row?.atk != null ? `ATK:${Number(row.atk)} ACC:${Number(row.acc || 0)}%` : (row?.def != null ? `DEF:${Number(row.def)} EVA:${Number(row.eva || 0)}` : "");
          return `<button type="button" class="candidate ${sel ? "sel" : ""}" data-candidate-index="${i}">${name}${stockLabel}<div style="color:var(--muted);font-size:.92rem;">${sub}</div></button>`;
        }).join("");

        candidateGrid.querySelectorAll(".candidate").forEach((el) => {
          el.onclick = async () => {
            const i = Number(el.getAttribute("data-candidate-index") || 0);
            candIdx = Number.isFinite(i) ? i : 0;
            mode = "candidate";
            render();
            await commitSelection();
          };
        });

        const modeMsg = mode === "candidate" ? "候補を選択中" : "スロット選択中";
        message.textContent = `${modeMsg} / ${slotLabel[slot]} / ${cmdMode === "equip" ? "そうび" : cmdMode === "remove" ? "はずす" : "かいじょ"}`;
        renderCommandBar();
      }

      async function refreshState() {
        const resp = await fetch("/menu/state");
        menuState = await resp.json();
      }

      async function changeEquipment(slot, itemName) {
        const resp = await fetch("/menu/change-equipment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ member_index: memberIdx, slot, item_name: itemName }),
        });
        const body = await resp.json();
        if (body?.menu_state) menuState = body.menu_state;
      }

      async function unequipAll() {
        const resp = await fetch("/menu/unequip-all", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ member_index: memberIdx }),
        });
        const body = await resp.json();
        if (body?.menu_state) menuState = body.menu_state;
      }

      async function commitSelection() {
        const slot = slots[slotIdx] || "main_hand";

        if (cmdMode === "release" || slot === "unequip_all") {
          await unequipAll();
          mode = "slot";
          message.textContent = "全装備を外しました。";
          render();
          return;
        }

        if (cmdMode === "remove") {
          if (slot !== "unequip_all") await changeEquipment(slot, null);
          mode = "slot";
          message.textContent = `${slotLabel[slot]} を外しました。`;
          render();
          return;
        }

        const candidates = slot === "unequip_all" ? [{kind:"none",name:null}] : candidatesForSlot(slot);
        if (mode === "slot") {
          mode = "candidate";
          candIdx = 0;
          render();
          return;
        }

        const row = candidates[candIdx] || { name: null };
        await changeEquipment(slot, row?.name || null);
        mode = "slot";
        message.textContent = `${slotLabel[slot]} を ${row?.name || "はずす"} に設定しました。`;
        render();
      }

      function moveMember(delta) {
        const party = Array.isArray(menuState?.party) ? menuState.party : [];
        if (!party.length) return;
        memberIdx = (memberIdx + delta + party.length) % party.length;
        slotIdx = 0; candIdx = 0; mode = "slot";
        render();
      }
      function moveVertical(delta) {
        const slot = slots[slotIdx] || "main_hand";
        if (mode === "slot") {
          slotIdx = (slotIdx + delta + slots.length) % slots.length;
          candIdx = 0;
        } else {
          const candidates = slot === "unequip_all" ? [{kind:"none",name:null}] : candidatesForSlot(slot);
          if (candidates.length) candIdx = (candIdx + delta + candidates.length) % candidates.length;
        }
        render();
      }

      document.getElementById("prevBtn").addEventListener("click", () => moveMember(-1));
      document.getElementById("nextBtn").addEventListener("click", () => moveMember(1));
      document.getElementById("backBtn").addEventListener("click", () => {
        if (mode === "candidate") {
          mode = "slot";
          render();
          return;
        }
        goMenu();
      });

      slotsGrid.addEventListener("click", async (event) => {
        const slotCell = event.target.closest("[data-slot-index]");
        if (!slotCell) return;
        const nextSlotIdx = Number(slotCell.getAttribute("data-slot-index") || slotIdx);
        if (!Number.isInteger(nextSlotIdx)) return;
        slotIdx = Math.max(0, Math.min(slots.length - 1, nextSlotIdx));
        mode = "slot";
        candIdx = 0;
        render();
        await commitSelection();
      });

      window.addEventListener("keydown", async (event) => {
        if (event.key === "ArrowLeft") { event.preventDefault(); moveMember(-1); }
        else if (event.key === "ArrowRight") { event.preventDefault(); moveMember(1); }
        else if (event.key === "ArrowUp") { event.preventDefault(); moveVertical(-1); }
        else if (event.key === "ArrowDown") { event.preventDefault(); moveVertical(1); }
        else if (event.key === "Enter") { event.preventDefault(); await commitSelection(); }
        else if (event.key === "Backspace") {
          event.preventDefault();
          if (mode === "candidate") { mode = "slot"; render(); }
          else { goMenu(); }
        } else if (event.key === "Escape") {
          event.preventDefault();
          goMenu();
        }
      });

      parseInitialState();
      render();
    </script>
  </body>
</html>
