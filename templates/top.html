<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle Round Runner</title>
    <style>
      :root {
        --bg: #04081d;
        --panel: rgba(15, 23, 66, 0.94);
        --border: rgba(233, 240, 255, 0.7);
        --text: #f4f7ff;
        --muted: #b2bcdf;
        --accent: #ffe37f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--text);
        font-family: "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
        background: radial-gradient(circle at 20% 0%, #1a2b84 0%, transparent 45%), var(--bg);
      }
      .battle-layout {
        width: min(760px, 100vw);
        min-height: 100vh;
        margin: 0 auto;
        padding: 8px;
        display: grid;
        gap: 8px;
        grid-template-rows: auto auto 1fr;
      }
      .frame {
        border: 2px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
      }
      .panel-title {
        margin: 0;
        font-size: 0.95rem;
        color: var(--accent);
      }

      .top-section { padding: 8px; }
      .party-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .party-card {
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        padding: 6px 4px;
        text-align: center;
        background: rgba(0, 0, 0, 0.2);
      }
      .party-card.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(255, 227, 127, 0.4) inset;
      }
      .portrait {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        image-rendering: pixelated;
        background: #090909;
      }
      .party-name { font-weight: bold; font-size: 0.86rem; margin-top: 4px; }
      .party-hp-bar {
        margin-top: 4px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }
      .party-hp-fill {
        height: 100%;
        background: linear-gradient(90deg, #66e286, #37b35f);
      }
      .party-hp-text {
        margin-top: 2px;
        font-size: 0.74rem;
        color: #d9ffe8;
      }

      .mid-section {
        position: relative;
        padding: 8px;
        min-height: 170px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.25)),
          rgba(7, 12, 37, 0.88);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
      .sprite-grid {
        margin-top: 6px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
        gap: 6px;
      }
      .sprite-card {
        position: relative;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 5px;
        text-align: left;
        background: rgba(0, 0, 0, 0.38);
        cursor: pointer;
        transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
        animation: sprite-idle-float 2.6s ease-in-out infinite;
        animation-delay: calc(var(--enemy-idx, 0) * 0.08s);
      }
      .sprite-card.targeted {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(255, 227, 127, 0.38);
      }
      .sprite-card.is-hit {
        animation: sprite-hit 320ms ease;
      }
      .sprite-card::after {
        content: "";
        position: absolute;
        inset: 4px;
        border: 2px dashed rgba(255, 227, 127, 0.85);
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
      }
      .sprite-card.targeted::after {
        opacity: 1;
        animation: reticle-pulse 680ms ease-in-out infinite;
      }
      .sprite-card img {
        width: 100%;
        height: 64px;
        object-fit: contain;
        image-rendering: pixelated;
        background: rgba(0, 0, 0, 0.3);
      }
      .sprite-name { font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .enemy-hp-bar {
        margin-top: 4px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }
      .enemy-hp-fill {
        height: 100%;
        background: linear-gradient(90deg, #66e286, #37b35f);
      }
      .enemy-hp-text {
        font-size: 0.74rem;
        color: #d9ffe8;
      }

      .battle-vfx-layer {
        pointer-events: none;
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .battle-vfx-layer .spark {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.95), rgba(255, 171, 71, 0.15));
        animation: spark-burst 500ms ease-out forwards;
      }
      @keyframes sprite-idle-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes reticle-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.03); opacity: 0.4; }
      }
      @keyframes sprite-hit {
        0% { filter: brightness(1); }
        25% { filter: brightness(1.8) saturate(1.3); }
        100% { filter: brightness(1); }
      }
      @keyframes spark-burst {
        0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
      }

      .bottom-section {
        padding: 8px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 8px;
      }
      .status-line { font-size: 0.86rem; color: var(--muted); }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .btn {
        border: 1px solid rgba(244, 247, 255, 0.75);
        border-radius: 8px;
        background: linear-gradient(180deg, #4459bf, #20317e);
        color: var(--text);
        font-size: 0.92rem;
        padding: 9px 8px;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn.secondary { background: linear-gradient(180deg, #50535e, #2c2f39); }
      .candidate-panel {
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 8px;
        max-height: 210px;
        overflow: auto;
        display: none;
      }
      .candidate-panel.open { display: block; }
      .log-panel {
        display: none;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        max-height: 240px;
        overflow: auto;
        padding: 8px;
        white-space: pre-wrap;
        line-height: 1.4;
        background: rgba(0, 0, 0, 0.35);
      }
      .log-panel.open { display: block; }
      .next-turn-note {
        display: none;
        margin-top: 6px;
        font-size: 0.84rem;
        color: var(--accent);
      }
      .next-turn-note.open { display: block; }
      .hidden { display: none; }
      .dev-tools { padding: 8px; }
      .dev-tools summary { cursor: pointer; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="battle-layout">
      <section class="frame top-section">
        <h2 class="panel-title">上部: PARTY</h2>
        <div id="partyGrid" class="party-grid"></div>
      </section>

      <section id="enemySpriteBoard" class="frame mid-section">
        <h2 class="panel-title">中部: Enemy Sprites（攻撃対象をタップ）</h2>
        <div id="enemySpriteGrid" class="sprite-grid"></div>
        <div id="battleVfxLayer" class="battle-vfx-layer" aria-hidden="true"></div>
      </section>

      <section class="frame bottom-section">
        <div>
          <h2 class="panel-title">下部: COMMAND</h2>
          <div id="statusLine" class="status-line"></div>
        </div>

        <div id="commandPanel">
          <div id="baseCommands" class="menu-grid"></div>
          <div id="candidatePanel" class="candidate-panel"></div>
          <div id="logPanel" class="log-panel"></div>
          <div id="nextTurnNote" class="next-turn-note">Enter または画面タップで次のターンへ進みます。</div>
          <div class="menu-grid" style="margin-top:6px;">
            <button id="backBtn" class="btn secondary" type="button">もどる</button>
            <a href="/menu"><button class="btn secondary" type="button">Field Menu</button></a>
          </div>
        </div>
      </section>

      <details class="frame dev-tools">
        <summary>開発用コントロール（場所選択）</summary>
        <form method="get" action="/" style="margin-top: 10px; display:flex; gap:8px; flex-wrap: wrap; align-items: center;">
          <label for="locationGroupSelect">LocationGroup</label>
          <select id="locationGroupSelect" name="location_group" style="width:auto; min-width: 220px;">
            {% for group in location_groups %}
            <option value="{{ group.group_name }}" {% if group.group_name == selected_location_group %}selected{% endif %}>{{ group.group_name }}</option>
            {% endfor %}
          </select>

          <label for="locationSelect">location</label>
          <select id="locationSelect" name="location" style="width:auto; min-width: 220px;">
            {% for group in location_groups %}
              {% for loc in group.locations %}
                {% if group.group_name == selected_location_group %}
                <option value="{{ loc }}" {% if loc == selected_location %}selected{% endif %}>{{ loc }}</option>
                {% endif %}
              {% endfor %}
            {% endfor %}
          </select>
          <button type="submit">敵編成を更新</button>
        </form>
      </details>
    </main>

    <script id="initialSessionStatusJson" type="application/json">{{ initial_session_status|tojson }}</script>
    <script id="commandCandidatesJson" type="application/json">{{ {
      "battle_by_member": battle_commands_by_member,
      "magic_by_member": magic_command_candidates_by_member,
      "item": item_command_candidates,
      "special": special_command_candidates
    }|tojson }}</script>
    <script id="selectedLocationGroupJson" type="application/json">{{ selected_location_group|tojson }}</script>

    <script>
      const partyGrid = document.getElementById("partyGrid");
      const enemySpriteBoard = document.getElementById("enemySpriteBoard");
      const enemySpriteGrid = document.getElementById("enemySpriteGrid");
      const battleVfxLayer = document.getElementById("battleVfxLayer");
      const statusLine = document.getElementById("statusLine");
      const baseCommands = document.getElementById("baseCommands");
      const candidatePanel = document.getElementById("candidatePanel");
      const logPanel = document.getElementById("logPanel");
      const nextTurnNote = document.getElementById("nextTurnNote");
      const backBtn = document.getElementById("backBtn");

      let initialSessionStatus = { party: [], enemies: [] };
      let commandCandidates = { battle_by_member: [], magic_by_member: [], item: [], special: [] };
      let pendingActions = [];
      let currentMemberIndex = 0;
      let selectedEnemyIndex = 0;
      let inCandidateMode = false;
      let awaitingNextTurn = false;
      let selectedLocationGroup = "";
      let previousEnemyState = [];

      try { initialSessionStatus = JSON.parse(document.getElementById("initialSessionStatusJson").textContent || "{}"); } catch (_e) {}
      try { commandCandidates = JSON.parse(document.getElementById("commandCandidatesJson").textContent || "{}"); } catch (_e) {}
      try { selectedLocationGroup = JSON.parse(document.getElementById("selectedLocationGroupJson").textContent || '""'); } catch (_e) {}

      const defaultLifecycle = "{{ default_lifecycle }}";

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function fallbackSpriteDataUri(name) {
        const label = encodeURIComponent(name.slice(0, 6));
        const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 90'><rect width='120' height='90' fill='#111'/><text x='60' y='50' fill='#ddd' font-size='12' text-anchor='middle'>${label}</text></svg>`;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      function buildEnemySpriteUrl(spriteId, enemyName) {
        if (!spriteId) return fallbackSpriteDataUri(enemyName || "Enemy");
        return `/assets/enemy-sprites/${encodeURIComponent(String(spriteId))}.png`;
      }

      function buildPortraitUrl(portraitKey, memberName) {
        if (!portraitKey) return fallbackSpriteDataUri(memberName || "Member");
        return `/assets/portraits/${encodeURIComponent(String(portraitKey))}`;
      }

      function renderParty() {
        const party = Array.isArray(initialSessionStatus.party) ? initialSessionStatus.party : [];
        partyGrid.innerHTML = "";
        party.forEach((member, index) => {
          const card = document.createElement("article");
          card.className = `party-card ${index === currentMemberIndex ? "active" : ""}`;
          const hp = Number(member?.hp ?? 0);
          const maxHp = Math.max(1, Number(member?.max_hp ?? 1));
          const hpRate = Math.max(0, Math.min(100, Math.round((hp / maxHp) * 100)));
          card.innerHTML = `
            <img class="portrait" alt="${escapeHtml(member.name)}" src="${buildPortraitUrl(member?.portrait_key, member?.name)}" />
            <div class="party-name">${escapeHtml(member.name || `Member ${index + 1}`)}</div>
            <div class="party-hp-bar"><div class="party-hp-fill" style="width:${hpRate}%"></div></div>
            <div class="party-hp-text">HP ${hp}/${maxHp} &nbsp; LV ${member.level ?? "-"}</div>
          `;
          partyGrid.appendChild(card);
        });
      }

      function spawnHitSpark(card) {
        if (!battleVfxLayer || !card) return;
        const boardRect = battleVfxLayer.getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();
        const centerX = cardRect.left - boardRect.left + cardRect.width / 2;
        const centerY = cardRect.top - boardRect.top + cardRect.height / 2;
        for (let i = 0; i < 7; i += 1) {
          const spark = document.createElement("span");
          spark.className = "spark";
          spark.style.left = `${centerX}px`;
          spark.style.top = `${centerY}px`;
          spark.style.setProperty("--dx", `${Math.round((Math.random() * 70) - 35)}px`);
          spark.style.setProperty("--dy", `${Math.round((Math.random() * 70) - 35)}px`);
          battleVfxLayer.appendChild(spark);
          spark.addEventListener("animationend", () => spark.remove(), { once: true });
        }
      }

      function renderEnemies() {
        const enemies = Array.isArray(initialSessionStatus.enemies) ? initialSessionStatus.enemies : [];
        enemySpriteGrid.innerHTML = "";
        enemies.forEach((enemy, index) => {
          const card = document.createElement("article");
          card.className = `sprite-card ${index === selectedEnemyIndex ? "targeted" : ""}`;
          card.style.setProperty("--enemy-idx", String(index));
          const hp = Number(enemy?.hp ?? 0);
          const maxHp = Math.max(1, Number(enemy?.max_hp ?? 1));
          const hpRate = Math.max(0, Math.min(100, Math.round((hp / maxHp) * 100)));
          card.innerHTML = `
            <img alt="${escapeHtml(enemy.name || "Enemy")}" src="${buildEnemySpriteUrl(enemy?.sprite_id, enemy?.name)}" />
            <div class="sprite-name">${escapeHtml(enemy.name || `Enemy ${index + 1}`)}</div>
            <div class="enemy-hp-bar"><div class="enemy-hp-fill" style="width:${hpRate}%"></div></div>
            <div class="enemy-hp-text">${hp}/${maxHp}</div>
          `;
          const before = previousEnemyState[index];
          const beforeHp = Number(before?.hp ?? hp);
          if (hp < beforeHp) {
            card.classList.add("is-hit");
            card.addEventListener("animationend", () => {
              card.classList.remove("is-hit");
            }, { once: true });
            spawnHitSpark(card);
          }

          card.addEventListener("click", () => {
            if (awaitingNextTurn) return;
            selectedEnemyIndex = index;
            renderEnemies();
          });
          enemySpriteGrid.appendChild(card);
        });
        previousEnemyState = enemies.map((enemy) => ({ hp: Number(enemy?.hp ?? 0) }));
      }

      function applyLocationGroupBackground(locationGroup) {
        if (!enemySpriteBoard) return;
        if (!locationGroup) {
          enemySpriteBoard.style.backgroundImage = "";
          return;
        }
        const url = `/assets/ui/location-group-bg/${encodeURIComponent(String(locationGroup))}`;
        const probe = new Image();
        probe.onload = () => {
          enemySpriteBoard.style.backgroundImage =
            `linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(0, 0, 0, 0.25)), url('${url}')`;
        };
        probe.onerror = () => {
          enemySpriteBoard.style.backgroundImage = "";
        };
        probe.src = url;
      }

      const SPECIAL_NO_TARGET = new Set(["Cheer", "Scare", "Flee", "Terrain", "Boost"]);

      function commandLabel(command, kind) {
        if (kind === "physical") return "たたかう";
        if (kind === "defend") return "ぼうぎょ";
        if (kind === "magic") return "まほう";
        if (kind === "item") return "アイテム";
        if (kind === "run") return "にげる";
        return command || "special";
      }

      function buildAction(kind, command, extra = {}) {
        const action = {
          kind,
          command,
          target_side: "enemy",
          target_index: selectedEnemyIndex,
          target_all: false,
          ...extra,
        };
        return action;
      }

      function buildSelfAction(kind, command, extra = {}) {
        return {
          kind,
          command,
          target_side: "self",
          target_index: currentMemberIndex,
          target_all: false,
          ...extra,
        };
      }

      function closeCandidateMode() {
        inCandidateMode = false;
        candidatePanel.classList.remove("open");
        candidatePanel.innerHTML = "";
        baseCommands.classList.remove("hidden");
      }

      function openCandidateMode(type) {
        inCandidateMode = true;
        baseCommands.classList.add("hidden");
        candidatePanel.classList.add("open");
        const options = type === "magic"
          ? (commandCandidates.magic_by_member?.[currentMemberIndex] || [])
          : (commandCandidates.item || []);

        const rows = options.length ? options : ["(候補なし)"];
        candidatePanel.innerHTML = rows.map((name, index) => {
          const disabled = name === "(候補なし)" ? "disabled" : "";
          return `<button type="button" class="btn" data-candidate-index="${index}" ${disabled}>${escapeHtml(name)}</button>`;
        }).join("<div style='height:6px;'></div>");

        candidatePanel.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            const pick = btn.textContent;
            if (!pick || pick === "(候補なし)") return;
            if (type === "magic") {
              selectAction(buildAction("magic", "Magic", { spell_name: pick }));
            } else {
              selectAction(buildAction("item", "Item", { item_name: pick }));
            }
            closeCandidateMode();
          });
        });
      }

      function selectAction(action) {
        pendingActions[currentMemberIndex] = action;
        currentMemberIndex += 1;
        if (currentMemberIndex >= (initialSessionStatus.party?.length || 0)) {
          sendPlannedActions();
          return;
        }
        renderParty();
        renderBaseCommands();
        renderStatusLine();
      }

      function renderBaseCommands() {
        baseCommands.innerHTML = "";
        const memberCommands = commandCandidates.battle_by_member?.[currentMemberIndex] || [];
        const commands = memberCommands.length ? memberCommands : [
          { command: "Fight", kind: "physical" },
          { command: "Defend", kind: "defend" },
          { command: "Item", kind: "item" },
          { command: "Run", kind: "run" },
        ];

        commands.forEach((entry) => {
          const command = String(entry?.command || "");
          const kind = String(entry?.kind || "physical");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "btn";
          button.textContent = commandLabel(command, kind);
          button.addEventListener("click", () => {
            if (awaitingNextTurn) return;
            if (kind === "magic") {
              openCandidateMode("magic");
              return;
            }
            if (kind === "item") {
              openCandidateMode("item");
              return;
            }
            if (kind === "defend" || kind === "run" || (kind === "special" && SPECIAL_NO_TARGET.has(command))) {
              selectAction(buildSelfAction(kind, command));
              return;
            }
            selectAction(buildAction(kind, command));
          });
          baseCommands.appendChild(button);
        });
      }

      function renderStatusLine() {
        if (awaitingNextTurn) {
          statusLine.textContent = "行動結果を表示中";
          return;
        }
        const member = initialSessionStatus.party?.[currentMemberIndex];
        if (!member) return;
        statusLine.textContent = `${member.name} のコマンドを選択してください（対象: ${selectedEnemyIndex + 1}）`;
      }

      function startResultMode(logsText) {
        awaitingNextTurn = true;
        baseCommands.classList.add("hidden");
        candidatePanel.classList.remove("open");
        logPanel.classList.add("open");
        nextTurnNote.classList.add("open");
        logPanel.textContent = logsText || "ログがありません。";
        renderStatusLine();
      }

      async function sendPlannedActions() {
        const body = { planned_actions: pendingActions, lifecycle_state: defaultLifecycle };
        renderStatusLine();
        try {
          const response = await fetch("/battle/round", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const payload = await response.json();
          if (payload?.session_status) {
            initialSessionStatus = payload.session_status;
          }
          const logs = Array.isArray(payload?.logs) ? payload.logs.join("\n") : JSON.stringify(payload, null, 2);
          startResultMode(logs);
          renderParty();
          renderEnemies();
        } catch (error) {
          startResultMode(`request failed: ${error}`);
        }
      }

      function startNextTurn() {
        awaitingNextTurn = false;
        pendingActions = [];
        currentMemberIndex = 0;
        selectedEnemyIndex = 0;
        closeCandidateMode();
        logPanel.classList.remove("open");
        nextTurnNote.classList.remove("open");
        renderParty();
        renderEnemies();
        renderBaseCommands();
        renderStatusLine();
      }

      backBtn.addEventListener("click", () => {
        if (awaitingNextTurn) return;
        if (inCandidateMode) {
          closeCandidateMode();
          return;
        }
        if (currentMemberIndex <= 0) return;
        currentMemberIndex -= 1;
        pendingActions[currentMemberIndex] = undefined;
        renderParty();
        renderBaseCommands();
        renderStatusLine();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && awaitingNextTurn) {
          event.preventDefault();
          startNextTurn();
        }
      });
      document.addEventListener("click", () => {
        if (awaitingNextTurn) startNextTurn();
      });

      renderParty();
      renderEnemies();
      applyLocationGroupBackground(selectedLocationGroup);
      renderBaseCommands();
      renderStatusLine();
    </script>
  </body>
</html>
